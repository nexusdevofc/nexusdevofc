name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Traduzir e colorir cards
        run: |
          git pull --rebase || true
          find profile-summary-card-output/github_dark -type f -name '*.svg' -exec sed -i \
            -e 's/Total Stars:/Estrelas:/g' \
            -e 's/Total Commits:/Commits:/g' \
            -e 's/Total PRs:/PRs:/g' \
            -e 's/Total Issues:/Issues:/g' \
            -e 's/Contributed to:/Contribuiu em:/g' \
            -e 's/Top Languages by Repo/Linguagens por repositório/g' \
            -e 's/Top Languages by Commit/Linguagens por commit/g' \
            -e 's/There are no/Sem/g' \
            -e 's/repos to show/repositórios/g' \
            -e 's/commits to show/commits/g' \
            -e 's/#0366d6/#bb9af7/g' \
            -e 's/#0d1117/#1a1b26/g' \
            -e 's/#77909c/#a9b1d6/g' \
            -e 's/#8b949e/#7aa2f7/g' \
            -e 's/#2e343b/#292e42/g' \
            {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --staged --quiet || (git commit -m "Traduz e colore cards" && git push)
